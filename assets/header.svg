<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="AarsyDesign banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#3fb950;#f778ba;#58a6ff" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#3fb950;#f778ba;#58a6ff;#bc8cff" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3fb950">
        <animate attributeName="stop-color" values="#3fb950;#f778ba;#58a6ff;#bc8cff;#3fb950" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#1f2633" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>
  <circle cx="220" cy="70" r="230" fill="url(#glow1)">
    <animate attributeName="cx" values="220;980;220" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="250" r="220" fill="url(#glow2)">
    <animate attributeName="cx" values="980;220;980" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- corner brackets -->
  <path d="M40 60 v-22 h22" fill="none" stroke="#30363d" stroke-width="3"/>
  <path d="M1160 60 v-22 h-22" fill="none" stroke="#30363d" stroke-width="3"/>
  <path d="M40 240 v22 h22" fill="none" stroke="#30363d" stroke-width="3"/>
  <path d="M1160 240 v22 h-22" fill="none" stroke="#30363d" stroke-width="3"/>

  <!-- pixel office nod: little desks row -->
  <g opacity="0.85">
    <rect x="60" y="238" width="26" height="6" fill="#30363d"/>
    <rect x="66" y="220" width="14" height="18" rx="2" fill="#1f6feb"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="104" y="238" width="26" height="6" fill="#30363d"/>
    <rect x="110" y="220" width="14" height="18" rx="2" fill="#8957e5"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="148" y="238" width="26" height="6" fill="#30363d"/>
    <rect x="154" y="220" width="14" height="18" rx="2" fill="#238636"><animate attributeName="opacity" values="1;0.35;1" dur="3.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- name -->
  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="#e6edf3" letter-spacing="6">AARSY<tspan fill="url(#flow)">DESIGN</tspan></text>

  <!-- animated underline -->
  <rect x="420" y="162" width="360" height="4" rx="2" fill="url(#flow)">
    <animate attributeName="width" values="360;180;360" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="420;510;420" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="205" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#8b949e" letter-spacing="7">WEB DESIGN • FRONT-END • FLUTTER • AI AGENTS</text>
  <text x="600" y="243" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" fill="#3fb950" letter-spacing="3">&gt; building small things that actually work_</text>
</svg>
